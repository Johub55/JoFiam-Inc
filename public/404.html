<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Werkdonalds POS & WerkPay Bank</title>
    <meta name="description" content="Geïntegreerd kassasysteem naadloos gekoppeld aan WerkPay Bank met live betalingen, keuken KDS, afhaal-TV en Supabase cloud synchronisatie." />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages SPA redirect
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>

  </body>
</html>
